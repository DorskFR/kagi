[package]
name = "kagi"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Passkey (WebAuthn) relying-party toolkit on webauthn-rs: ceremonies, decoys, step-up and removal policy."
repository = "https://github.com/DorskFR/kagi"
readme = "README.md"
publish = false
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# Serializable ceremonies, for stores shared between replicas.
serde = ["webauthn-rs/danger-allow-state-serialisation"]

[dependencies]
base64 = "0.23"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
webauthn-rs = { version = "=0.6.2", default-features = false, features = ["conditional-ui"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
ts-rs = "12"
